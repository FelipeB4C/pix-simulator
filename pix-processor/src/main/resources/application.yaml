server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: pix-processor
  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: jdbc:postgresql://localhost:5432/pix_processor
    username: pix
    password: pix
    hikari:
      maximum-pool-size: 15

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration